<svg viewBox="0 0 1180 720" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="1180" height="720" fill="#ffffff"/>

  <text x="40" y="40" font-size="20" font-weight="700" fill="#111827">LLM-Powered Customer Support Agent — Architecture &amp; Trust Boundaries</text>
  <text x="40" y="62" font-size="12" fill="#6b7280">Hypothetical fintech system — illustrative, not based on a real company</text>

  <!-- Trust Boundary 1 -->
  <rect x="330" y="90" width="330" height="190" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="345" y="112" font-size="12" font-weight="700" fill="#c2410c">TRUST BOUNDARY 1 — user input enters LLM context</text>

  <!-- Trust Boundary 2 -->
  <rect x="330" y="330" width="330" height="150" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="345" y="352" font-size="12" font-weight="700" fill="#b91c1c">TRUST BOUNDARY 2 — model output triggers real actions</text>

  <!-- User nodes -->
  <g>
    <rect x="20" y="110" width="220" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="130" y="132" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">Authenticated User</text>
    <text x="130" y="149" font-size="10.5" fill="#3b5aa0" text-anchor="middle">in-app chat</text>
  </g>
  <g>
    <rect x="20" y="180" width="220" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="130" y="202" font-size="13" font-weight="600" fill="#1e3a8a" text-anchor="middle">WhatsApp User</text>
    <text x="130" y="219" font-size="10.5" fill="#3b5aa0" text-anchor="middle">phone-based identity (weak auth)</text>
  </g>
  <g>
    <rect x="20" y="250" width="220" height="52" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="130" y="272" font-size="13" font-weight="600" fill="#991b1b" text-anchor="middle">Public Website Visitor</text>
    <text x="130" y="289" font-size="10.5" fill="#b91c1c" text-anchor="middle">pre-login, UNAUTHENTICATED</text>
  </g>

  <!-- Gateway -->
  <rect x="280" y="180" width="40" height="52" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="300" y="202" font-size="10" fill="#374151" text-anchor="middle">API</text>
  <text x="300" y="214" font-size="10" fill="#374151" text-anchor="middle">GW</text>

  <!-- Orchestration -->
  <rect x="360" y="150" width="270" height="70" rx="8" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/>
  <text x="495" y="178" font-size="13" font-weight="600" fill="#7c2d12" text-anchor="middle">LLM Orchestration Layer</text>
  <text x="495" y="195" font-size="10.5" fill="#9a3412" text-anchor="middle">prompt assembly + RAG retrieval</text>

  <!-- Knowledge base -->
  <rect x="700" y="100" width="220" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="810" y="122" font-size="12.5" font-weight="600" fill="#5b21b6" text-anchor="middle">Knowledge Base</text>
  <text x="810" y="138" font-size="10" fill="#6d28d9" text-anchor="middle">FAQs, policy docs,</text>
  <text x="810" y="151" font-size="10" fill="#6d28d9" text-anchor="middle">past support tickets</text>

  <!-- LLM API -->
  <rect x="700" y="190" width="220" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="810" y="215" font-size="12.5" font-weight="600" fill="#065f46" text-anchor="middle">Hosted LLM API</text>
  <text x="810" y="232" font-size="10" fill="#047857" text-anchor="middle">third-party provider</text>

  <!-- Tool calling layer -->
  <rect x="360" y="390" width="270" height="60" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/>
  <text x="495" y="416" font-size="13" font-weight="600" fill="#7f1d1d" text-anchor="middle">Tool-Calling Layer</text>
  <text x="495" y="433" font-size="10.5" fill="#991b1b" text-anchor="middle">function/tool dispatch</text>

  <!-- Tools -->
  <g>
    <rect x="760" y="330" width="200" height="34" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
    <text x="860" y="352" font-size="11" fill="#166534" text-anchor="middle">get_account_summary (read)</text>
  </g>
  <g>
    <rect x="760" y="372" width="200" height="34" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.3"/>
    <text x="860" y="394" font-size="11" fill="#166534" text-anchor="middle">get_transaction_history (read)</text>
  </g>
  <g>
    <rect x="760" y="414" width="200" height="34" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
    <text x="860" y="436" font-size="11" font-weight="700" fill="#991b1b" text-anchor="middle">block_card — WRITE, HIGH RISK</text>
  </g>
  <g>
    <rect x="760" y="456" width="200" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="860" y="478" font-size="11" fill="#92400e" text-anchor="middle">create_support_ticket (write)</text>
  </g>
  <g>
    <rect x="760" y="498" width="200" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.3"/>
    <text x="860" y="520" font-size="11" fill="#92400e" text-anchor="middle">escalate_to_human (write)</text>
  </g>

  <!-- DB -->
  <rect x="1000" y="390" width="150" height="60" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="1075" y="415" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">Core Banking /</text>
  <text x="1075" y="431" font-size="12" font-weight="600" fill="#3730a3" text-anchor="middle">Account DB</text>

  <!-- Arrows: users to gateway -->
  <path d="M240,136 L280,200" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M240,206 L280,206" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M240,276 L280,215" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- Gateway to orchestration -->
  <path d="M320,200 L360,185" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>

  <!-- KB / LLM to orchestration -->
  <path d="M700,130 L630,170" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M700,220 L630,195" stroke="#4b5563" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,205 L700,210" stroke="#9ca3af" stroke-width="1.3" fill="none" stroke-dasharray="3,3" marker-end="url(#arrow)"/>

  <!-- Orchestration down to tool-calling layer -->
  <path d="M495,220 L495,390" stroke="#4b5563" stroke-width="1.8" fill="none" marker-end="url(#arrow)"/>

  <!-- Tool-calling to tools -->
  <path d="M630,400 L760,347" stroke="#4b5563" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,410 L760,389" stroke="#4b5563" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,420 L760,431" stroke="#991b1b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,430 L760,473" stroke="#4b5563" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M630,440 L760,515" stroke="#4b5563" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>

  <!-- Tools to DB -->
  <path d="M960,347 L1000,405" stroke="#4b5563" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M960,389 L1000,415" stroke="#4b5563" stroke-width="1.3" fill="none" marker-end="url(#arrow)"/>
  <path d="M960,431 L1000,425" stroke="#991b1b" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/>

  <!-- Legend -->
  <g transform="translate(40,560)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#111827">Legend</text>
    <rect x="0" y="14" width="16" height="12" fill="#f0fdf4" stroke="#22c55e"/>
    <text x="22" y="24" font-size="11" fill="#374151">Read-only tool</text>
    <rect x="150" y="14" width="16" height="12" fill="#fffbeb" stroke="#f59e0b"/>
    <text x="172" y="24" font-size="11" fill="#374151">Write, low risk</text>
    <rect x="320" y="14" width="16" height="12" fill="#fef2f2" stroke="#ef4444" stroke-width="1.6"/>
    <text x="342" y="24" font-size="11" fill="#374151">Write, high risk (needs deterministic confirmation, not model judgment)</text>

    <rect x="0" y="40" width="16" height="12" fill="#fff7ed" stroke="#f97316" stroke-dasharray="3,2"/>
    <text x="22" y="50" font-size="11" fill="#374151">Trust boundary — user input enters LLM context</text>
    <rect x="0" y="62" width="16" height="12" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="3,2"/>
    <text x="22" y="72" font-size="11" fill="#374151">Trust boundary — model output triggers real actions</text>
  </g>

  <text x="40" y="700" font-size="10.5" fill="#9ca3af">Hypothetical architecture for threat modeling purposes only · OWASP LLM Top 10 / MITRE ATLAS mapping in accompanying write-up</text>
</svg>
